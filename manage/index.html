<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="./manage.css"><title>MyTV Channel Manager</title></head><body><header><a href="../">← Watch MyTV</a><h1>MyTV Channel Manager</h1><p>Saved on this device. Export to move settings to another device.</p></header><main><aside><div class="side-title"><h2>Channels</h2><button id="new-channel">+ New</button></div><div id="channel-list"></div><div class="transfer"><button id="export">Export JSON</button><label>Import JSON<input id="import" type="file" accept="application/json"></label></div></aside><section id="editor" class="editor"><p>Select a channel to edit.</p></section></main><template id="channel-template"><form id="channel-form"><h2>Edit channel</h2><div class="form-grid"><label>Name<input name="name" required maxlength="32"></label><label>Number<input name="number" type="number" min="1" required></label><label>Icon<input name="icon" maxlength="4" placeholder="📺"></label><label>Colour<input name="color" type="color"></label></div><label class="check"><input name="kids" type="checkbox"> Suitable for Kids mode</label><label class="check"><input name="simple" type="checkbox"> Show in Simple mode</label><div class="actions"><button type="submit">Save channel</button><button type="button" id="delete-channel" class="danger">Delete channel</button></div></form><section class="videos"><h2>Playlist</h2><p class="muted">Videos repeat in this order. The TV joins the scheduled position when changing channel.</p><div id="video-list"></div><form id="video-form"><h3>Add video URL</h3><label>Direct MP4 or HLS URL<input name="url" type="url" required placeholder="https://…"></label><div class="form-grid"><label>Title<input name="title" required placeholder="My video"></label><label>Duration (seconds)<input name="duration" type="number" min="1" required value="300"></label></div><div class="actions"><button type="button" id="preview">Preview</button><button type="submit">Add to playlist</button></div><video id="preview-player" controls playsinline class="hidden"></video><p id="preview-status" class="muted"></p></form></section></template><script src="../data.js"></script><script src="./manage.js"></script></body></html>
